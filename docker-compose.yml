services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: expense_bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: expense_bot
    volumes:
      # On the server: POSTGRES_DATA_DIR=/mnt/cram-data/finance/postgres (persistent volume)
      # Locally: leave unset → falls back to the named volume `pgdata`
      - ${POSTGRES_DATA_DIR:-pgdata}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense_bot"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Single source of truth: derive the DB URL from POSTGRES_PASSWORD so the
      # bot and db can never disagree (this overrides any DATABASE_URL in .env).
      DATABASE_URL: postgresql://expense_bot:${POSTGRES_PASSWORD}@db:5432/expense_bot
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Service-account key, mounted read-only
      - ./service_account.json:/app/service_account.json:ro

# Own isolated network/volume — nothing shared with the Cram stack.
volumes:
  pgdata:
